<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de procesos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de trabajo para gerentes sin formación en procesos; clara, guiada, sin jerga.
   IDEA: una carpeta de proceso que se recorre por pasos: mapa › flujo › caracterización › procedimiento › oportunidades.
   PICTURE: el mapa ISO y el diagrama de carriles son la imagen; el resto son fichas limpias.
   COLOUR and TYPE: fondo gris claro, superficies blancas, verde profundo como color principal, coral para alertas; Inter.
   LAYOUT: barra de contexto (ruta + pasos) fija arriba; contenido a ancho completo; panel lateral al seleccionar. */
:root{color-scheme:light;--bg:#f3f5f4;--panel:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--line2:#d1d5db;--pri:#0b5d4b;--pri2:#e7f2ee;--acc:#e8553f;--acc2:#fdecea;--ok:#15803d;--soft:#f8faf9;--sh:0 1px 2px #1118270d,0 4px 14px #11182710;--r:12px}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
a{color:var(--pri)}
h1,h2,h3,h4{letter-spacing:-.01em}
/* encabezado */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px max(2.5vw,14px);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.brand svg{flex:none}
.brand h1{margin:0;font-size:17px;line-height:1.1;font-weight:700}.brand small{display:block;color:var(--mut);font-size:13px}
.views{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.views button{border:0;background:none;padding:7px 14px;border-radius:7px;min-height:36px;font-weight:500;color:var(--mut)}
.views button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.hr{display:flex;gap:8px;align-items:center}
.mode{font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;background:var(--soft);border:1px solid var(--line);color:var(--mut)}.mode.g{background:var(--pri2);border-color:#b7dccf;color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:8px 14px;min-height:40px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:#094c3d}
.btn.ghost{border-color:transparent;background:none;color:var(--mut)}.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:14px}.btn.dang{color:#b42318;border-color:#f3c4bd}
.lnk{border:0;background:none;padding:2px;color:var(--pri);font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:14px}
#banner{padding:9px max(2.5vw,14px);font-size:14px;background:#fff7ed;border-bottom:1px solid #fde3c3}#banner:empty{display:none}
/* contexto: ruta + pasos */
.ctx{position:sticky;top:57px;z-index:15;background:var(--bg);padding:12px max(2.5vw,14px) 10px;border-bottom:1px solid var(--line)}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:14px;color:var(--mut);margin-bottom:8px}
#crumbs button{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--mut)}#crumbs button:hover{background:var(--panel);color:var(--ink)}
#crumbs .cur{color:var(--ink);font-weight:700;font-size:20px;padding:0 4px}#crumbs .via{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 8px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.st{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 14px 6px 6px;min-height:42px;font-weight:500;font-size:14px;color:var(--ink)}
.st b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.st.ok b{background:var(--pri2);border-color:#b7dccf;color:var(--pri)}
.st.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}.st.on b{background:var(--pri);border-color:var(--pri);color:#fff}
.st:disabled{opacity:.5;cursor:not-allowed}
/* contenido */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px max(2.5vw,14px) 40px;align-items:start}
.wrap.withd{grid-template-columns:minmax(0,1fr) 360px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.sh{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.sh h2{margin:0;font-size:24px;line-height:1.15}.sh p{margin:4px 0 0;color:var(--mut);max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.end{justify-content:flex-end}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.mut{color:var(--mut);font-size:14px;margin:4px 0}.hint{font-size:13px;color:var(--mut);margin:4px 0 10px}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:8px 0}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;font-size:16px;font-weight:400;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:42px}
label textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.empty{text-align:center;padding:48px 20px}.empty h3{font-size:20px;margin:0 0 6px}.empty p{color:var(--mut);margin:0 auto 16px;max-width:52ch}
/* mapa ISO */
.iso{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:12px;padding:16px}
.iso-side{display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--ink);color:#fff}
.iso-side span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:14px;padding:14px 0;text-align:center}
.iso-side.r{background:var(--pri)}.iso-side.r span{transform:none}
.iso-b{display:grid;gap:12px}
.band{border-radius:10px;padding:12px 14px 14px;border:1px solid var(--line)}
.band h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:13px;text-transform:none;color:var(--ink);font-weight:700}
.band h3 small{font-weight:400;color:var(--mut);margin-left:6px}
.band.est{background:#f3f6fb;border-color:#dfe6f1}.band.ope{background:var(--pri2);border-color:#c5e2d7}.band.apo{background:#f7f7f5}
.boxes{display:flex;flex-wrap:wrap;gap:10px}
.pbox{flex:1 1 180px;max-width:300px;min-height:92px;text-align:left;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh);transition:transform .12s}
.pbox:hover{transform:translateY(-1px);border-color:var(--ink)}.pbox.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.pbox b{font-size:15px;line-height:1.25}.pbox small{color:var(--mut);font-size:12px}
.meta2{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:12px;color:var(--mut)}
.seg{display:flex;gap:3px}.seg i{width:16px;height:5px;border-radius:3px;background:var(--line)}.seg i.on{background:var(--ok)}
.op{color:#b42318;background:var(--acc2);border-radius:10px;padding:0 7px;font-weight:600}
.ope .boxes{flex-wrap:nowrap;overflow-x:auto;gap:0;padding:2px 2px 6px}
.ope .pbox{flex:1 0 180px;max-width:none;border:0;border-radius:0;background:var(--pri);color:#fff;padding:12px 30px 12px 32px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%,20px 50%);margin-right:-12px;box-shadow:none}
.ope .pbox:first-child{clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%);padding-left:16px}
.ope .pbox:nth-child(even){background:#0f7a63}.ope .pbox.sel{background:var(--ink)}
.ope .pbox small,.ope .meta2{color:#ffffffcc}.ope .seg i{background:#ffffff40}.ope .seg i.on{background:#86efac}.ope .op{background:#ffffff26;color:#fff}
.emptyb{color:var(--mut);font-size:14px;padding:6px 2px}
/* flujo */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fbar .sp{flex:1}
.ic{width:38px;height:38px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;font-size:16px}
.seg2{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}.seg2 button{border:0;background:var(--panel);padding:7px 12px;font-size:14px;min-height:36px}.seg2 button.on{background:var(--ink);color:#fff}
details.menu{position:relative}details.menu summary{list-style:none}details.menu summary::-webkit-details-marker{display:none}
.mlist{position:absolute;right:0;top:calc(100% + 6px);z-index:12;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #11182722;padding:6px;min-width:230px;display:grid}
.mlist button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px;font-size:14px}.mlist button:hover{background:var(--soft)}.mlist .dang{color:#b42318}
#viewport{overflow:auto;max-height:calc(100vh - 290px);min-height:360px;padding:18px;background:var(--soft);border-radius:0 0 var(--r) var(--r)}
#stage{position:relative;margin:0 auto;background:#fff;border-radius:8px;box-shadow:var(--sh)}
#stage canvas,#stage img{display:block;border-radius:8px}
#ov{position:absolute;inset:0}#ov.zonas{cursor:crosshair;background:repeating-linear-gradient(45deg,transparent 0 12px,#0b5d4b0a 12px 14px)}
.hs{position:absolute;border:2px solid transparent;background:transparent;border-radius:10px;padding:0}
.hs:hover{border-color:var(--pri);background:#0b5d4b10}.hs.sel{border-color:var(--pri);background:#0b5d4b1c;box-shadow:0 0 0 3px #0b5d4b33}
#ov.zonas .hs{border:1.5px dashed var(--pri);background:#0b5d4b0d}
.bdg{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;line-height:20px;padding:0 6px;font-weight:700;box-shadow:0 0 0 2px #fff}
.draw{position:absolute;border:2px solid var(--pri);background:#0b5d4b1a;pointer-events:none;border-radius:6px}
#tip{position:fixed;z-index:40;max-width:300px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;pointer-events:none;box-shadow:0 8px 24px #0005}
#tip b{display:block;font-size:14px}#tip i{display:block;font-style:normal;color:#d1d5db;margin-bottom:3px}
/* panel lateral */
#drawer{position:sticky;top:150px}
.dr h3{font-size:19px;line-height:1.2;margin:2px 0 6px}.dr .eye{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0}
.dr dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}.dr dt{color:var(--mut)}.dr dd{margin:0;overflow-wrap:anywhere}
.dr .desc{white-space:pre-wrap;font-size:14px;background:var(--soft);border-radius:8px;padding:8px 10px;margin:8px 0}
.dsec{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.dsec h4{margin:0 0 8px;font-size:14px}
.go{display:grid;gap:6px}.go button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;font-size:14px;font-weight:500}
.go button:hover{border-color:var(--pri)}.go button b{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--soft);border:1px solid var(--line);font-size:12px;color:var(--mut)}.go button.ok b{background:var(--pri2);color:var(--pri);border-color:#b7dccf}
.go button span{flex:1}.go button em{font-style:normal;color:var(--mut);font-size:12px}
.subc{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--soft)}.subh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 6px;font-size:14px}
.xclose{float:right;border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1}
/* caracterización */
.chev{display:flex;overflow-x:auto;padding-bottom:4px;margin:4px 0 14px}
.cv{flex:1 1 0;min-width:150px;background:var(--pri);color:#fff;padding:12px 28px 12px 32px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);font-weight:600;font-size:14px;line-height:1.25;margin-right:-10px}
.cv:first-child{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);padding-left:16px}.cv:nth-child(even){background:#0f7a63}
.cv small{display:block;font-size:11px;opacity:.75}.cv i{display:block;font-style:normal;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.mh{display:flex;gap:8px;align-items:center}.mn{flex:none;width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.mh input{flex:1;font-size:15px;font-weight:600;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;min-height:40px;background:#fff}
.mcard label input{min-height:38px;font-size:14px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip2{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:3px 9px;font-size:12.5px}
.chip2 button{border:0;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;line-height:1;padding:0}
.sip table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.sip th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line2);background:var(--soft)}
.sip td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.sip textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 8px;font-size:14px;min-height:84px;resize:vertical}
.sip .sp{background:var(--pri2);border-radius:8px;min-width:150px;padding:10px}
.scroll{overflow-x:auto}
/* procedimiento */
.pgrid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.pprev{border:1px solid var(--line);border-radius:10px;background:#fff;max-height:74vh;overflow:auto}
.doc{padding:30px 34px;color:#111827;font:13.5px/1.55 Arial,Helvetica,sans-serif}
.doc h3{font-size:15px;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid #0b5d4b;color:#0b5d4b}.doc h4{font-size:13.5px;margin:14px 0 6px}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}.doc td,.doc th{border:1px solid #cbd5d1;padding:5px 7px;vertical-align:top;text-align:left}.doc th{background:#e7f2ee;font-weight:700}
.doc .dh td{font-size:11.5px}.doc .dh .dt{font-size:18px;font-weight:700;width:50%;color:#0b5d4b}.doc .pend{color:#b42318;font-style:italic}.doc .dimg{max-width:100%;border:1px solid #e5e7eb;border-radius:6px}
/* oportunidades */
.qlist{font-size:13.5px;columns:2 320px;margin:6px 0 12px;padding-left:20px}.qlist li{break-inside:avoid;margin-bottom:3px}
.mx table{min-width:920px;width:100%;border-collapse:collapse;font-size:14px}
.mx th{font-size:12px;font-weight:600;color:var(--mut);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line2);cursor:help;background:var(--soft)}.mx th:first-child{text-align:left}
.mx td{padding:7px 8px;border-bottom:1px solid var(--line)}.mx .ck{text-align:center}.mx .ck input{width:20px;height:20px;accent-color:var(--pri)}
.mx .gr td{background:var(--pri2);font-weight:600;color:var(--pri);font-size:13px}.mx small{color:var(--mut)}
.sug{border:1px solid #b7dccf;background:var(--pri2);border-radius:10px;padding:12px 14px;margin-top:14px}
.sr{display:flex;gap:8px;align-items:center;margin-bottom:6px}.sr input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--pri)}
.sr .st2{flex:1;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:15px;min-height:40px;background:#fff}.sr select{min-height:40px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.opc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.opc .ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.opc .ch strong{font-size:15px}
.opc p{margin:4px 0;font-size:14px;color:var(--mut);white-space:pre-wrap}
.cm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;margin-top:6px;color:var(--mut)}
.chip{border:1px solid var(--line2);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:500;color:var(--ink)}
.chip.pa{background:var(--acc2);border-color:#f6c5bd;color:#b42318}.chip.pm{background:#fff7ed;border-color:#fde3c3;color:#9a4b00}.chip.pb{background:var(--soft)}.chip.cl{background:var(--pri2);border-color:#b7dccf;color:var(--pri)}
.inis{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}
.ini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13.5px;padding:5px 0}
.ini .cm{margin:0}.prog{width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}.prog i{display:block;height:100%;background:var(--pri)}
.acts{display:flex;gap:8px;flex:none}
details.box{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;background:var(--soft)}details.box summary{cursor:pointer;font-weight:600}
/* portafolio */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px}.kpi b{display:block;font-size:clamp(26px,3.6vw,36px);line-height:1.05}.kpi span{font-size:13px;color:var(--mut)}.kpi.al b{color:#b42318}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters select,.filters input{min-height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:6px 10px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:10px;border-bottom:1px solid var(--line2);background:var(--soft)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}table.t .nw{white-space:nowrap}
/* diálogo y editor */
dialog{border:0;border-radius:14px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:20px 22px;box-shadow:0 24px 60px #11182740}
dialog.wide{width:min(1180px,97vw)}dialog::backdrop{background:#11182766}dialog h3{font-size:20px;margin:0 0 6px}
.aed{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.aed table{min-width:960px;width:100%;border-collapse:collapse}
.aed td{padding:5px;vertical-align:top;border-bottom:1px solid var(--line)}.aed th{position:sticky;top:0;background:var(--soft);z-index:1;padding:8px 6px;font-size:12px;font-weight:600;color:var(--mut);text-align:left}
.aed input,.aed select,.aed textarea{width:100%;border:1px solid var(--line2);border-radius:7px;padding:6px 7px;font-size:14px;background:var(--panel);min-height:36px}.aed textarea{resize:vertical}
.aed .n{width:60px}.aed .t{width:120px}.aed .s{width:210px}.aed .d{width:44px}
.x{border:1px solid var(--line2);background:none;border-radius:7px;width:34px;min-height:34px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
/* ===== CONFIGURACIÓN: URL del servidor (Apps Script › Implementar › Gestionar implementaciones › URL que termina en /exec) ===== */
const API_URL='https://script.google.com/macros/s/AKfycbwdsMuhqMk2BCuMwMAqx8Ih2GX0O_QBVmbEwIGqx7eb82JdCAEhoWjwhVuRGfnKHgjPNQ/exec';
</script>
<script>
{
/* ================= base ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const num=v=>{const n=+v;return isFinite(n)?n:0};
const hoy=()=>new Date().toISOString().slice(0,10);
const FORMAS=['Actividad','Decisión','Inicio','Fin','Documento'];
const CATS=[['estrategico','Estratégico','Procesos estratégicos','est','Dirección: planificación, revisión, mejora.'],['operativo','Operativo','Procesos operativos','ope','Los que generan el producto o servicio, de punta a punta.'],['apoyo','De apoyo','Procesos de apoyo','apo','Soporte: compras, personal, finanzas, mantenimiento.']];
const EST_OP=['Identificada','En análisis','En implementación','Cerrada'],EST_IN=['No iniciada','En curso','Completada','Detenida'];
const S={diag:{},items:{},cur:'raiz',step:'mapa',sel:null,selMap:null,page:1,pages:1,zoom:1,zonas:false,view:'app',dirty:false,scope:null};
let BOOT={mode:'cargando'},C='',K='',canWrite=false,dlgOk=null,dlgCancel=null,pending=0;
const mem={},urls={},pdfCache={},fileReq={},queue={};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4200)}
function armed(b){if(b.dataset.armed)return true;b.dataset.armed=1;const t=b.textContent;b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},3000);return false}
function sel(n,opts,val,attrs){return `<select name="${n}"${attrs||''}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===val?' selected':''}>${esc(l)}</option>`}).join('')}</select>`}

/* ================= servidor ================= */
async function run(fn,...args){
  let r;
  try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
  catch(e){throw new Error('Sin conexión con el servidor. Revisa internet.')}
  let j;try{j=await r.json()}catch(e){throw new Error('El servidor no respondió correctamente.')}
  if(!j.ok)throw new Error(j.error||'Error del servidor.');return j.data}
function busy(on){pending=Math.max(0,pending+(on?1:-1));$('#btnRefresh').textContent=pending?'Guardando…':'Actualizar'}
function enqueue(key,fn){queue[key]=(queue[key]||Promise.resolve()).then(()=>{busy(true);return fn()}).catch(e=>{toast('No se guardó: '+e.message);load()}).finally(()=>busy(false));return queue[key]}
function put(col,obj){const k=col==='diagramas'?'diag':'items',o=clone(obj);S[k][o.id]=o;render();if(!canWrite)return Promise.resolve();return enqueue(o.id,()=>run('api_save',C,K,col,o))}
function del(col,id){const k=col==='diagramas'?'diag':'items';delete S[k][id];render();if(!canWrite)return Promise.resolve();return enqueue(id,()=>run('api_delete',C,K,col,id))}
async function load(){try{const r=await run('api_load',C);S.diag=Object.fromEntries((r.diag||[]).map(d=>[d.id,d]));S.items=Object.fromEntries((r.items||[]).map(i=>[i.id,i]));ensureRoot();$('#banner').textContent='';render(true)}catch(e){$('#banner').textContent='No se pudieron cargar los datos: '+e.message}}
function ensureRoot(){if(S.diag.raiz)return;const r={id:'raiz',raiz:true,nombre:BOOT.cliente?BOOT.cliente.nombre:'Empresa',actividades:[],creado:new Date().toISOString()};if(canWrite)put('diagramas',r);else S.diag.raiz=r}
const b64ToBlob=(b64,mime)=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})};
const fileToB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)});
function blobOf(id){if(!id)return Promise.resolve(null);if(mem[id])return Promise.resolve(mem[id]);if(!fileReq[id])fileReq[id]=run('api_file',C,id).then(r=>(mem[id]=b64ToBlob(r.b64,r.mime))).catch(e=>{delete fileReq[id];throw e});return fileReq[id]}
async function uploadFile(f){
  const ok=['application/pdf','image/png','image/jpeg','image/svg+xml','image/webp'];
  if(!ok.includes(f.type))throw new Error('Formato no admitido. Usa PDF, PNG, JPG, SVG o WEBP.');
  if(f.size>20*1024*1024)throw new Error('El archivo supera 20 MB.');
  toast('Subiendo archivo…');busy(true);
  try{const id=await run('api_upload',C,K,f.name,f.type,await fileToB64(f));mem[id]=f;return{id,kind:f.type==='application/pdf'?'pdf':'img'}}finally{busy(false)}}

/* ================= modelo ================= */
const D=id=>id?S.diag[id]:null;
const par=d=>d.raiz?null:(d.parentId&&S.diag[d.parentId]?d.parentId:'raiz');
const byName=(a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es');
const nodes=()=>Object.values(S.diag).filter(d=>!d.raiz);
const kids=(id,aId)=>nodes().filter(d=>par(d)===id&&(aId===undefined||(d.parentActId||null)===(aId||null))).sort(byName);
const mapKids=()=>kids('raiz',null);
const subsOf=(d,a)=>kids(d.id,a.id);
function subtree(id,seen=new Set()){if(seen.has(id))return[];seen.add(id);return[id,...kids(id).flatMap(k=>subtree(k.id,seen))]}
function ancestors(id){const out=[];let d=D(id),g=0;while(d&&!d.raiz&&g++<40){const p=D(par(d));if(!p)break;out.unshift({d:p,act:d.parentActId||null});d=p}return out}
const actOf=(d,aId)=>(d&&d.actividades||[]).find(a=>a.id===aId)||null;
const orderActs=d=>(d&&d.actividades||[]).map((a,i)=>({a,i})).sort((x,y)=>(num(x.a.orden)||1e6+x.i)-(num(y.a.orden)||1e6+y.i)||x.i-y.i).map(x=>x.a);
const isOpenOp=i=>i.tipo==='oportunidad'&&i.estado!=='Cerrada';
const opsOf=id=>Object.values(S.items).filter(i=>i.tipo==='oportunidad'&&i.diagramaId===id);
const inisOf=opId=>Object.values(S.items).filter(i=>i.tipo==='iniciativa'&&i.oportunidadId===opId);
const openIn=ids=>Object.values(S.items).filter(i=>ids.has(i.diagramaId)&&isOpenOp(i)).length;
const hasFile=d=>!!(d&&d.assetId);
const isGen=d=>!hasFile(d)||d.vista==='generado';
function responsables(){return [...new Set(Object.values(S.diag).flatMap(d=>[(d.dueno||'').trim(),...(d.actividades||[]).map(a=>String(a.responsable||'').trim())]).filter(Boolean))].sort()}
const STEPS=[['mapa','Mapa de procesos'],['flujo','Flujo'],['car','Caracterización'],['proc','Procedimiento'],['ops','Oportunidades']];
const docsOn=d=>d.raiz||(d.docs!==undefined?!!d.docs:!d.parentActId);
const stepsOf=d=>d.raiz?STEPS:STEPS.slice(1).filter(s=>docsOn(d)||s[0]==='flujo'||s[0]==='ops');
const stepKeys=d=>stepsOf(d).map(s=>s[0]).filter(s=>s!=='mapa');
function hecho(d,s){if(!d)return false;
  if(s==='mapa')return mapKids().length>0;
  if(s==='flujo')return(d.actividades||[]).length>=2;
  if(s==='car')return Array.isArray(d.macro)&&d.macro.length>0&&d.macro.some(m=>m.sipoc&&(m.sipoc.e||m.sipoc.s));
  if(s==='proc')return!!(d.proc&&d.proc.objetivo);
  if(s==='ops')return opsOf(d.id).length>0;return false}

/* ================= diagrama generado ================= */
let genCache={key:'',L:null};
function wrapTxt(s,n){const w=String(s||'').split(/\s+/),L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>n&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim()});return L.slice(0,4)}
function ramasOf(a){if(Array.isArray(a.ramas)&&a.ramas.length)return a.ramas;const s=a.sig||[];return [{etiqueta:'Sí',dest:s[0]||''},{etiqueta:'No',dest:s[1]||''}]}
function layoutFlow(d){
  const acts=orderActs(d),key=JSON.stringify([d.nombre,acts,kids(d.id).map(k=>k.parentActId)]);
  if(genCache.key===key)return genCache.L;
  const lanes=[...new Set(acts.map(a=>String(a.responsable||'').trim()||'Sin responsable'))];
  const lw=160,cw=200,LH=142,top=20,bw=158,bh=70,W=Math.max(900,lw+30+Math.max(1,acts.length)*cw),H=top+Math.max(1,lanes.length)*LH+20;
  const pos={},P={};
  acts.forEach((a,i)=>{const lane=lanes.indexOf(String(a.responsable||'').trim()||'Sin responsable');const x=lw+24+i*cw+(cw-bw)/2,y=top+lane*LH+(LH-bh)/2;P[a.id]={x,y,lane,i};pos[a.id]={x:x/W,y:y/H,w:bw/W,h:bh/H}});
  let g=`<rect width="${W}" height="${H}" fill="#ffffff"/>`;
  if(!acts.length)g+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="16" fill="#6b7280">Sin actividades todavía</text>`;
  lanes.forEach((l,i)=>{const y=top+i*LH;g+=`<rect x="10" y="${y}" width="${W-20}" height="${LH}" fill="${i%2?'#f8faf9':'#ffffff'}" stroke="#e5e7eb"/><rect x="10" y="${y}" width="${lw}" height="${LH}" fill="#e7f2ee" stroke="#e5e7eb"/>`;
    wrapTxt(l,17).forEach((t,j,a)=>{g+=`<text x="${10+lw/2}" y="${y+LH/2+(j-(a.length-1)/2)*18+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#0b5d4b">${esc(t)}</text>`})});
  acts.forEach((a,i)=>{
    const p=P[a.id],dec=a.forma==='Decisión';let tg;
    if(dec&&Array.isArray(a.ramas)&&a.ramas.length)tg=a.ramas.filter(r=>P[r.dest]&&r.dest!==a.id).map(r=>({id:r.dest,lbl:r.etiqueta}));
    else{tg=(Array.isArray(a.sig)?a.sig:[]).filter(id=>P[id]&&id!==a.id).map(id=>({id,lbl:''}));if(!tg.length&&a.forma!=='Fin'&&acts[i+1])tg=[{id:acts[i+1].id,lbl:''}]}
    tg.forEach((t,k)=>{const q=P[t.id],cx=p.x+bw/2;let path,lx,ly;
      if(k===0){const x1=p.x+bw+(dec?4:0),y1=p.y+bh/2;
        if(q.i>p.i){const m=p.x+bw+(cw-bw)/2,y2=q.y+bh/2;path=`M${x1} ${y1} H${m} V${y2} H${q.x-2}`}
        else{const lb=top+(Math.max(p.lane,q.lane)+1)*LH-10;path=`M${x1} ${y1} H${p.x+bw+(cw-bw)/2-6} V${lb} H${q.x+bw/2} V${q.y+bh+2}`}
        lx=x1+4;ly=y1-7}
      else{const y1=p.y+bh+(dec?6:0),yb=Math.min(top+(p.lane+1)*LH-6,y1+14+(k-1)*8);
        if(q.i>p.i){const m=q.x-(cw-bw)/2+6+(k-1)*5;path=`M${cx} ${y1} V${yb} H${m} V${q.y+bh/2} H${q.x-2}`}
        else path=`M${cx} ${y1} V${yb} H${q.x+bw/2+(k-1)*8} V${q.y+bh+2}`;
        lx=cx+6;ly=y1+13}
      g+=`<path d="${path}" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar)"/>`;
      if(t.lbl)g+=`<text x="${lx}" y="${ly}" font-size="12" font-weight="700" fill="#0b5d4b">${esc(t.lbl)}</text>`})});
  acts.forEach((a,i)=>{const p=P[a.id],cx=p.x+bw/2,cy=p.y+bh/2,f=a.forma||'Actividad',sub=kids(d.id,a.id).length;
    if(f==='Decisión')g+=`<path d="M${cx} ${p.y-6} L${p.x+bw+4} ${cy} L${cx} ${p.y+bh+6} L${p.x-4} ${cy}Z" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" filter="url(#s)"/>`;
    else if(f==='Inicio'||f==='Fin')g+=`<rect x="${p.x}" y="${p.y+8}" width="${bw}" height="${bh-16}" rx="${(bh-16)/2}" fill="${f==='Inicio'?'#e7f2ee':'#fdecea'}" stroke="${f==='Inicio'?'#0b5d4b':'#e8553f'}" stroke-width="1.5" filter="url(#s)"/>`;
    else if(f==='Documento')g+=`<path d="M${p.x} ${p.y} H${p.x+bw} V${p.y+bh-8} Q${p.x+bw*.75} ${p.y+bh-20} ${cx} ${p.y+bh-6} T${p.x} ${p.y+bh-6}Z" fill="#f3f6fb" stroke="#475569" stroke-width="1.4" filter="url(#s)"/>`;
    else g+=`<rect x="${p.x}" y="${p.y}" width="${bw}" height="${bh}" rx="10" fill="#ffffff" stroke="${sub?'#0b5d4b':'#9ca3af'}" stroke-width="${sub?2.2:1.3}" filter="url(#s)"/>`;
    if(sub)g+=`<rect x="${p.x+bw-30}" y="${p.y+bh-17}" width="24" height="13" rx="6.5" fill="#0b5d4b"/><text x="${p.x+bw-18}" y="${p.y+bh-7.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">+${sub}</text>`;
    g+=`<circle cx="${p.x+2}" cy="${p.y+2}" r="10" fill="#111827"/><text x="${p.x+2}" y="${p.y+6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${i+1}</text>`;
    wrapTxt(a.nombre,f==='Decisión'?14:19).forEach((t,j,L)=>{g+=`<text x="${cx}" y="${cy+(j-(L.length-1)/2)*16+5}" text-anchor="middle" font-size="13" font-weight="500" fill="#111827">${esc(t)}</text>`})});
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Inter, Arial, Helvetica, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#111827" flood-opacity=".12"/></filter></defs>${g}</svg>`;
  const L={svg,ar:H/W,pos,url:URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}))};
  if(genCache.L)URL.revokeObjectURL(genCache.L.url);genCache={key,L};return L}
const zoneOf=(d,a)=>isGen(d)?layoutFlow(d).pos[a.id]:(a.x!=null?a:null);

/* ================= PDF (opción secundaria) ================= */
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function getPdf(aid){if(!pdfCache[aid]){pdfCache[aid]=(async()=>{const b=await blobOf(aid);return pdfjsLib.getDocument({data:new Uint8Array(await b.arrayBuffer()),isEvalSupported:false}).promise})();pdfCache[aid].catch(()=>{delete pdfCache[aid]})}return pdfCache[aid]}
async function extract(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent(),bx=[];
    for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;const t=pdfjsLib.Util.transform(vp.transform,it.transform);const h=Math.hypot(t[2],t[3]);if(!h)continue;let w=it.width*vp.scale;if(!w)w=s.length*h*.5;bx.push({x:t[4],y:t[5]-h,w,h,s})}
    bx.sort((a,b)=>a.y-b.y||a.x-b.x);const bl=[];
    for(const b of bx){let m=null,same=false;
      for(const k of bl){const r=b.h/k.fh;if(r<.7||r>1.45)continue;const tol=b.h*1.1;if(!(b.x<k.x2+tol&&b.x+b.w>k.x-tol))continue;
        const sl=Math.abs(b.y-k.ly)<b.h*.5&&b.x<k.lx2+b.h*1.2,nl=b.y>k.ly+b.h*.3&&b.y-k.y2<b.h*.8;if(sl||nl){m=k;same=sl;break}}
      if(m){if(same)m.t+=b.x>m.lx2+b.h*.12?' ':'';else if(m.t.endsWith('-'))m.t=m.t.slice(0,-1);else m.t+=' ';m.t+=b.s;
        m.x=Math.min(m.x,b.x);m.y=Math.min(m.y,b.y);m.x2=Math.max(m.x2,b.x+b.w);m.y2=Math.max(m.y2,b.y+b.h);m.ly=b.y;m.lx2=b.x+b.w}
      else bl.push({x:b.x,y:b.y,x2:b.x+b.w,y2:b.y+b.h,fh:b.h,t:b.s,ly:b.y,lx2:b.x+b.w})}
    for(const k of bl){const t=k.t.replace(/\s+/g,' ').trim();if(t.length<3||!/[a-záéíóúñü]/i.test(t))continue;const pd=k.fh*.45;

    tk.forEach(w=>{const n=/^\d+$/.test(w)?+w:NUMW[w];if(n){rs.push({etiqueta:lbl||(rs.length===0?'Sí':rs.length===1?'No':'Opción '+(rs.length+1)),n});lbl=''}else lbl=(w==='si'?'Sí':w[0].toUpperCase()+w.slice(1))});

  case 'node-del':{const n=D(id)||d;if(n.raiz)break;if(kids(n.id).length){toast('Tiene subprocesos. Elimínalos primero.');break}if(!armed(b))break;
    opsOf(n.id).forEach(o=>{inisOf(o.id).forEach(i=>del('items',i.id));del('items',o.id)});if(n.assetId)run('api_trash',C,K,n.assetId).catch(()=>{});
    const back=par(n),sa=n.parentActId;del('diagramas',n.id);S.selMap=null;goNode(back,back==='raiz'&&!sa?'mapa':'flujo',sa);toast('Proceso eliminado.');break}
  case 'mv':{const n=D(S.selMap),l=procOrd(n.categoria),i=l.indexOf(n),j=i+(+b.dataset.d);if(j<0||j>=l.length)break;l.splice(j,0,l.splice(i,1)[0]);l.forEach((x,k)=>{if(num(x.ordenMapa)!==k+1)put('diagramas',{...x,ordenMapa:k+1})});break}
  case 'iso-lbl':{const cf=cfg();openDlg(`<h3>Textos del mapa</h3><label>Entrada (izquierda)<input name="izq" value="${esc(cf.izq)}"></label><label>Salida (derecha)<input name="der" value="${esc(cf.der)}"></label><div class="row end" style="margin-top:12px"><button type="button" class="btn" data-a="dlg-close">Cancelar</button><button class="btn pri">Guardar</button></div>`,fd=>{put('items',{id:'cfg_mapa',tipo:'config',izq:String(fd.get('izq')).trim()||cf.izq,der:String(fd.get('der')).trim()||cf.der})});break}
  case 'print':{const t=document.getElementById(b.dataset.t);if(!t)break;if(b.dataset.t==='procDoc')procPreview();document.body.classList.add('pr');setTimeout(()=>{try{window.print()}catch(err){toast('El navegador no permitió imprimir.')}document.body.classList.remove('pr')},60);break}
  case 'act':{const now=Date.now();if(S.zonas)break;if(lastClk.id===id&&now-lastClk.t<450){lastClk={};const a2=actOf(d,id),sb=a2?subsOf(d,a2):[];if(sb.length===1){goNode(sb[0].id,'flujo');break}}lastClk={id,t:now};S.sel=id;overlay();drawer();break}
  case 'acts':actsDlg(!!b.dataset.dictar);break;
  case 'act-edit':{const x=actOf(d,S.sel);if(x)actDlg(x);break}
  case 'act-del':{if(!armed(b))break;const aid=S.sel;closeDlg(false);S.sel=null;opsOf(d.id).filter(i=>i.actividadId===aid).forEach(it=>put('items',{...it,actividadId:null}));
    put('diagramas',{...D(d.id),actividades:(D(d.id).actividades||[]).filter(x=>x.id!==aid).map(x=>({...x,sig:(x.sig||[]).filter(s=>s!==aid),ramas:(x.ramas||[]).map(r=>r.dest===aid?{...r,dest:''}:r)}))});break}
  case 'sub-new':subDlg();break;
  case 'docs':{if(!d||d.raiz)break;const on=!!b.dataset.v;put('diagramas',{...d,docs:on});ck='';toast(on?'Se agregaron Caracterización y Procedimiento a este proceso.':'Caracterización y Procedimiento ocultos (lo ya registrado se conserva).');render(true);break}
  case 'vista':{if(!d)break;const v=b.dataset.v;S.page=1;S.zonas=false;if(canWrite)put('diagramas',{...d,vista:v});else{S.diag[d.id]={...d,vista:v};render(true)}break}
  case 'pg':S.page=Math.min(S.pages,Math.max(1,S.page+(+b.dataset.d)));S.sel=null;drawer();drawStage();break;
  case 'zonas':S.zonas=!S.zonas;S.sel=null;flujoBar(d);overlay();drawer();if(S.zonas)toast('Arrastra sobre el PDF para marcar cada actividad.');break;
  case 'zoom':{const z=+b.dataset.d;S.zoom=z===0?1:Math.min(4,Math.max(.4,S.zoom*(z>0?1.25:.8)));drawStage();break}
  case 'imp':$('#fileImp').click();break;
  case 'detect':if(d&&d.kind==='pdf')detect(d);break;
  case 'unimp':{if(!armed(b))break;const old=d.assetId;const n={...d};delete n.assetId;delete n.kind;delete n.vista;put('diagramas',n);if(old)run('api_trash',C,K,old).catch(()=>{});ck='';render(true);break}
  case 'row-add':{const tb=$('#aedBody'),n=tb.rows.length;tb.insertAdjacentHTML('beforeend',actRow({},n,[]));tb.rows[n].querySelector('[name=nombre]').focus();break}
  case 'row-del':b.closest('tr').remove();break;
  case 'rama-add':b.insertAdjacentHTML('beforebegin',ramaRow({etiqueta:'',n:''},[]));b.previousElementSibling.querySelector('[name=rl]').focus();break;
  case 'rama-del':b.closest('.rama').remove();break;
  case 'dic-start':if(listening){stopDictado();flushDictado(false)}else startDictado();break;
  case 'dic-apply':flushDictado(true);break;
  case 'dlg-close':closeDlg(true);break;
  case 'chk':$('#dlgForm').querySelectorAll('.rev input[type=checkbox]').forEach(c=>c.checked=!!b.dataset.v);break;
  case 'wz-save':wzSave(b.dataset.next);break;
  case 'wz-propose':S.wz=proponer(d,+($('#wzK')||{}).value||5);S.dirty=true;content();break;
  case 'mv-act':{const i=+b.dataset.m,dir=+b.dataset.d,W=S.wz;if(W[i].acts.length<2){toast('Cada gran actividad debe tener al menos una actividad.');break}if(dir<0)W[i-1].acts.push(W[i].acts.shift());else W[i+1].acts.unshift(W[i].acts.pop());S.dirty=true;content();break}
  case 'wz-sug':{const W=S.wz;W.forEach((m,i)=>{m.sipoc=m.sipoc||{p:'',e:'',s:'',c:''};if(i>0&&!m.sipoc.e.trim()&&(W[i-1].sipoc||{}).s)m.sipoc.e=W[i-1].sipoc.s;if(i>0&&!m.sipoc.p.trim()&&W[i-1].responsable)m.sipoc.p=W[i-1].responsable;if(i<W.length-1&&!m.sipoc.c.trim()&&W[i+1].responsable)m.sipoc.c=W[i+1].responsable});S.dirty=true;content();toast('Conexiones sugeridas. Revisa y completa.');break}
  case 'proc-copy':{const el=$('#procDoc');try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([`<div style="font-family:Arial">${el.innerHTML}</div>`],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})]);toast('Copiado. Pégalo en Word o Google Docs con Ctrl+V.')}catch(err){toast('El navegador no permitió copiar. Usa Imprimir › Guardar como PDF.')}break}
  case 'op-new':opDlg(null,b.dataset.act);break;
  case 'op-edit':opDlg(S.items[id]);break;
  case 'op-del':if(armed(b)){inisOf(id).forEach(i=>del('items',i.id));del('items',id)}break;
  case 'in-new':inDlg(null,b.dataset.op);break;
  case 'in-edit':inDlg(S.items[id]);break;
  case 'in-del':if(armed(b))del('items',id);break;
  case 'op-reg':{const list=[...document.querySelectorAll('#sugBox [data-sg]')].filter(x=>x.checked).map(x=>{const i=x.dataset.sg,[act,k]=document.querySelector(`[data-sgk="${i}"]`).value.split('|'),q=QS.find(z=>z.k===k);
      return{titulo:document.querySelector(`[data-sgt="${i}"]`).value.trim()||q.c,prioridad:document.querySelector(`[data-sgp="${i}"]`).value,actividadId:act,categoria:q.c,descripcion:q.q,origen:act+'|'+k}});
    if(!list.length){toast('No hay oportunidades seleccionadas.');break}
    list.forEach(o=>put('items',{id:uid(),tipo:'oportunidad',diagramaId:d.id,estado:'Identificada',actualizado:new Date().toISOString(),...o}));put('diagramas',{...D(d.id),chk:clone(S.wc)});S.dirty=false;render(true);toast(list.length===1?'1 oportunidad registrada.':list.length+' oportunidades registradas.');break}
  case 'csv':{const f=S.pf,q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=Object.values(S.items).filter(i=>i.tipo===f.t);
    const csv=[['Tipo','Título','Proceso','Prioridad','Estado','Responsable','Fecha','Avance'].map(q).join(','),...rows.map(i=>[i.tipo,i.titulo,pathOf(i.diagramaId),i.prioridad,i.estado,i.responsable,i.fecha,i.avance].map(q).join(','))].join('\n');
    try{await navigator.clipboard.writeText(csv);toast('CSV copiado. Pégalo en Google Sheets.')}catch(err){toast('El navegador no permitió copiar.')}break}
  }});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='pfQ'){S.pf.q=t.value;const pos=t.selectionStart;portfolio();const n=$('#pfQ');n.focus();n.setSelectionRange(pos,pos);return}
  if(!t.closest('#content'))return;
  if(t.dataset.f!==undefined&&t.dataset.m!==undefined){S.wz[+t.dataset.m][t.dataset.f]=t.value;S.dirty=true;const cv=document.querySelectorAll('.chev .cv')[+t.dataset.m];if(cv)cv.innerHTML=`<small>${+t.dataset.m+1}</small>${esc(S.wz[+t.dataset.m].nombre||'Sin nombre')}<i>${esc(S.wz[+t.dataset.m].responsable||'')}</i>`}
  else if(t.dataset.s&&t.dataset.m!==undefined){const m=S.wz[+t.dataset.m];m.sipoc=m.sipoc||{p:'',e:'',s:'',c:''};m.sipoc[t.dataset.s]=t.value;S.dirty=true}
  else if(t.dataset.p){S.wp[t.dataset.p]=t.value;S.dirty=true;procPreview()}
  else if(t.dataset.q&&t.type==='checkbox'){const id=t.dataset.id,arr=S.wc[id]=S.wc[id]||[];if(t.checked){if(!arr.includes(t.dataset.q))arr.push(t.dataset.q)}else S.wc[id]=arr.filter(x=>x!==t.dataset.q);S.dirty=true;$('#sugBox').innerHTML=sugHTML(D(S.cur))}
  else if(t.id==='wzK'){S.wz=proponer(D(S.cur),+t.value);S.dirty=true;content()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='pfT'||t.id==='pfE'){S.pf[t.id==='pfT'?'t':'e']=t.value;portfolio();return}
  if(t.dataset.a==='cat'){const n=D(S.selMap);if(!n)return;const c=t.value;setTimeout(()=>put('diagramas',{...n,categoria:c,ordenMapa:c?Math.max(0,...procOrd(c).filter(x=>x.id!==n.id).map(x=>num(x.ordenMapa)))+1:0}),0);return}
  if(t.name==='forma'&&t.closest('#aedBody')){const tr=t.closest('tr'),ord=orderActs(D(S.cur)).map(a=>a.id),cell=tr.querySelector('td.s');cell.innerHTML=sigCell(t.value==='Decisión'?{forma:'Decisión',ramas:[{etiqueta:'Sí',n:''},{etiqueta:'No',n:''}]}:{forma:t.value,sig:[]},ord)}});
document.addEventListener('submit',async e=>{const f=e.target;e.preventDefault();
  if(f.id==='dlgForm'&&dlgOk){const btn=f.querySelector('.btn.pri');if(btn)btn.disabled=true;let r;try{r=await dlgOk(new FormData(f))}finally{if(btn)btn.disabled=false}if(r!==false){dlgCancel=null;closeDlg(false)}}});
$('#dlg').addEventListener('cancel',()=>{stopDictado();if(dlgCancel)dlgCancel();dlgOk=dlgCancel=null});
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;render(true)}));
$('#btnRefresh').addEventListener('click',()=>{if(!pending)load()});
$('#fileImp').addEventListener('change',async e=>{const f=e.target.files[0],d=D(S.cur);e.target.value='';if(!f||!d)return;
  try{const up=await uploadFile(f),old=d.assetId;put('diagramas',{...D(d.id),assetId:up.id,kind:up.kind,vista:'archivo',revisado:up.kind!=='pdf'});ck='';render(true);
    if(old)run('api_trash',C,K,old).catch(()=>{});toast(up.kind==='pdf'?'PDF importado. Se leerán sus actividades.':'Imagen importada. Usa “Marcar zonas” para marcar actividades.')}catch(err){toast(err.message)}});

/* descripción al pasar el cursor */
const tip=$('#tip');let drag=null;
function showTip(e,b){const d=D(S.cur),a=actOf(d,b.dataset.id);if(!a){tip.hidden=true;return}const sb=subsOf(d,a);
  tip.innerHTML=`<b>${esc(a.nombre)}</b>${a.responsable?`<i>${esc(a.responsable)}</i>`:''}${a.descripcion?esc(a.descripcion.length>320?a.descripcion.slice(0,320)+'…':a.descripcion):'<i>Sin descripción</i>'}${a.forma==='Decisión'?'<i style="margin-top:4px">'+ramasOf(a).map(r=>{const t=actOf(d,r.dest);return esc(r.etiqueta)+' → '+(t?esc(t.nombre):'sin destino')}).join(' · ')+'</i>':''}${sb.length?`<i style="margin-top:4px">${sb.length>1?'Subprocesos':'Subproceso'}: ${sb.map(s=>esc(s.nombre)).join(', ')}${sb.length===1?' (doble clic para abrir)':''}</i>`:''}`;tip.hidden=false;moveTip(e)}
function moveTip(e){const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+16;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-12;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
document.addEventListener('mouseover',e=>{const b=e.target.closest('.hs');if(b&&!drag)showTip(e,b)});
document.addEventListener('mousemove',e=>{if(!tip.hidden){if(!e.target.closest('.hs'))tip.hidden=true;else moveTip(e)}});
document.addEventListener('scroll',()=>{tip.hidden=true},true);
/* zonas manuales sobre PDF o imagen */
document.addEventListener('pointerdown',e=>{const ov=e.target.closest('#ov');if(!ov||!S.zonas||e.target!==ov||!canWrite)return;const r=ov.getBoundingClientRect();drag={ov,r,x:e.clientX-r.left,y:e.clientY-r.top,el:document.createElement('div')};drag.el.className='draw';ov.appendChild(drag.el);ov.setPointerCapture(e.pointerId);tip.hidden=true;e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const x=e.clientX-drag.r.left,y=e.clientY-drag.r.top;Object.assign(drag.el.style,{left:Math.min(x,drag.x)+'px',top:Math.min(y,drag.y)+'px',width:Math.abs(x-drag.x)+'px',height:Math.abs(y-drag.y)+'px'});drag.ex=x;drag.ey=y});
document.addEventListener('pointerup',()=>{if(!drag)return;const g=drag;drag=null;g.el.remove();if(g.ex==null||Math.abs(g.ex-g.x)<8||Math.abs(g.ey-g.y)<8)return;
  const z={x:Math.min(g.x,g.ex)/g.r.width,y:Math.min(g.y,g.ey)/g.r.height,w:Math.abs(g.ex-g.x)/g.r.width,h:Math.abs(g.ey-g.y)/g.r.height,pag:S.page};
  openDlg(`<h3>Nueva actividad</h3><label>Actividad<input name="n" required></label><div class="two"><label>Responsable<input name="r" list="dlR4"></label><label>Tipo${sel('f',FORMAS,'Actividad')}</label></div><datalist id="dlR4">${responsables().map(r=>`<option value="${esc(r)}">`).join('')}</datalist><label>Descripción breve<textarea name="ds" rows="3"></textarea></label><div class="row end" style="margin-top:12px"><button type="button" class="btn" data-a="dlg-close">Cancelar</button><button class="btn pri">Crear</button></div>`,
  fd=>{const d=D(S.cur),id=uid();put('diagramas',{...d,actividades:[...(d.actividades||[]),{...z,id,orden:(d.actividades||[]).length+1,nombre:String(fd.get('n')).trim(),responsable:String(fd.get('r')||'').trim(),forma:fd.get('f'),descripcion:String(fd.get('ds')||'').trim()}]})})});
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==='app'&&S.step==='flujo'){lastKey='';drawStage()}},150)}).observe(document.body);

/* ================= administración ================= */
let adminList=[];
function adminRender(){
  $('#admin').innerHTML=`<div class="card pad" style="max-width:1100px;margin:0 auto;width:100%"><div class="sh"><div><h2>Clientes</h2><p>Cada cliente tiene dos enlaces: <b>Ver</b> (solo consulta) y <b>Gestionar</b> (carga y edita). También puedes crearlos desde la hoja de cálculo.</p></div></div>
  <form id="newCli" class="row" style="margin:6px 0 14px"><input name="n" placeholder="Nombre del cliente" required style="flex:1;min-height:42px;border:1px solid var(--line2);border-radius:9px;padding:6px 12px;font-size:16px"><button class="btn pri">Crear cliente</button></form>
  <div class="scroll"><table class="t"><thead><tr><th>Cliente</th><th>Enlace Ver</th><th>Enlace Gestionar</th><th></th></tr></thead><tbody>${adminList.length?adminList.map(c=>`<tr><td><b>${esc(c.nombre)}</b></td>
  <td><div class="lk"><input readonly value="${esc(c.ver)}" aria-label="Enlace Ver"><button class="btn sm" data-x="copy">Copiar</button></div></td>
  <td><div class="lk"><input readonly value="${esc(c.gestionar)}" aria-label="Enlace Gestionar"><button class="btn sm" data-x="copy">Copiar</button></div></td>
  <td class="nw"><a class="btn sm" href="${esc(c.gestionar)}" target="_blank" rel="noopener">Abrir</a> <button class="lnk" data-x="key" data-id="${esc(c.id)}">Nueva clave</button></td></tr>`).join(''):'<tr><td colspan="4" class="mut">Aún no hay clientes.</td></tr>'}</tbody></table></div></div>`}
async function adminInit(){$('#views').hidden=$('#btnRefresh').hidden=true;$('#app').hidden=true;$('#admin').hidden=false;$('#cliName').textContent='Administración';
  adminRender();try{adminList=await run('api_clients',BOOT.admin);adminRender()}catch(e){toast(e.message)}
  $('#admin').addEventListener('submit',async e=>{e.preventDefault();const n=e.target.n.value.trim();if(!n)return;try{adminList=await run('api_createClient',BOOT.admin,n);adminRender();toast('Cliente creado.')}catch(err){toast(err.message)}});
  $('#admin').addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;
    if(b.dataset.x==='copy'){const inp=b.previousElementSibling;try{await navigator.clipboard.writeText(inp.value);toast('Enlace copiado.')}catch(err){inp.select();toast('Pulsa Ctrl+C para copiar.')}}
    if(b.dataset.x==='key'){if(!armed(b))return;try{adminList=await run('api_newKey',BOOT.admin,b.dataset.id);adminRender();toast('Clave nueva generada.')}catch(err){toast(err.message)}}})}

/* ================= arranque ================= */
(async()=>{
  const q=new URLSearchParams(location.search);$('#banner').textContent='Cargando…';
  try{BOOT=await run('api_boot',{admin:q.get('admin')||'',cliente:q.get('cliente')||'',clave:q.get('clave')||''})}
  catch(e){document.body.innerHTML=`<div class="card msgbox"><h2 style="margin-top:0">Mapa de procesos</h2><p>${esc(e.message)}</p></div>`;return}
  $('#banner').textContent='';
  if(BOOT.mode==='admin'){$('#modeTag').textContent='Administrador';$('#modeTag').classList.add('g');adminInit();return}
  C=BOOT.cliente.id;K=BOOT.k||'';canWrite=BOOT.mode==='gestionar';document.title='Mapa de procesos · '+BOOT.cliente.nombre;
  $('#cliName').textContent=BOOT.cliente.nombre;$('#modeTag').textContent=canWrite?'Edición':'Solo consulta';$('#modeTag').classList.toggle('g',canWrite);
  $('#app').hidden=false;await load();
  setInterval(()=>{if(!pending&&!S.dirty&&!$('#dlg').open&&document.visibilityState==='visible')load()},120000);
})();
}
</script>
</body>
