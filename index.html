<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Mapa de procesos</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>

table{width:100%;border-collapse:collapse;font-size:14px}

.lk{display:flex;gap:6px}.lk input{flex:1;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px;min-height:36px;background:var(--soft)}

<script>
{

async function put(col,obj){const k=col==='diagramas'?'diag':'items',o=clone(obj);S[k][o.id]=o;render();if(!canWrite)return;return enqueue(o.id,()=>run('api_save',C,K,col,o))}

function b64ToBlob(b64,mime){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}

function blobOf(id){if(!id)return Promise.resolve(null);if(mem[id])return Promise.resolve(mem[id]);if(!fileReq[id])fileReq[id]=run('api_file',C,id).then(r=>(mem[id]=b64ToBlob(r.b64,r.mime))).catch(e=>{delete fileReq[id];throw e});return fileReq[id]}
async function uploadFile(f){
  const ok=['application/pdf','image/png','image/jpeg','image/svg+xml','image/webp'];
  if(!ok.includes(f.type))throw new Error('Formato no admitido. Usa PDF, PNG, JPG, SVG o WEBP.');
  if(f.size>20*1024*1024)throw new Error('El archivo supera 20 MB.');
  toast('Subiendo archivo…');busy(true);
  try{const id=await run('api_upload',C,K,f.name,f.type,await fileToB64(f));mem[id]=f;return{id,kind:f.type==='application/pdf'?'pdf':'img'}}finally{busy(false)}}

/* ---------- modelo ---------- */
const D=id=>id?S.diag[id]:null;
const byName=(a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es');
const kids=(dId,aId)=>Object.values(S.diag).filter(d=>d.parentId===dId&&(aId===undefined||d.parentActId===aId)).sort(byName);
const roots=()=>Object.values(S.diag).filter(d=>!d.parentId||!D(d.parentId)).sort((a,b)=>String(a.creado||'').localeCompare(String(b.creado||'')));
function subtree(id,seen=new Set()){if(seen.has(id))return[];seen.add(id);return[id,...kids(id).flatMap(k=>subtree(k.id,seen))]}
function ancestors(id){const out=[];let d=D(id),g=0;while(d&&d.parentId&&D(d.parentId)&&g++<40){out.unshift({d:D(d.parentId),act:d.parentActId});d=D(d.parentId)}return out}
const actOf=(d,aId)=>(d&&d.actividades||[]).find(a=>a.id===aId)||null;
const orderActs=d=>(d&&d.actividades||[]).map((a,i)=>({a,i})).sort((x,y)=>(num(x.a.orden)||1e6+x.i)-(num(y.a.orden)||1e6+y.i)||x.i-y.i).map(x=>x.a);
function offTarget(i){const m=parseFloat(i.meta),a=parseFloat(i.actual);if(isNaN(m)||isNaN(a))return false;return i.sentido==='min'?a>m:a<m}
const isOpen=i=>i.tipo==='oportunidad'?i.estado!=='Cerrada':i.tipo==='iniciativa'?!['Completada','Detenida'].includes(i.estado):offTarget(i);
const itemsAt=(dId,aId,t)=>Object.values(S.items).filter(i=>i.diagramaId===dId&&(i.actividadId||null)===(aId||null)&&(!t||i.tipo===t));
function scopeIds(dId,aId){const ch=aId?kids(dId,aId):kids(dId);return new Set(ch.flatMap(c=>subtree(c.id)))}
const rolled=(dId,aId,t)=>{const ids=scopeIds(dId,aId);return Object.values(S.items).filter(i=>ids.has(i.diagramaId)&&(!t||i.tipo===t))};
function pathOf(i){const d=D(i.diagramaId);if(!d)return'(sin diagrama)';const p=ancestors(d.id).map(x=>x.d.nombre);p.push(d.nombre);const a=actOf(d,i.actividadId);if(a)p.push(a.nombre);return p.join(' › ')}
const isGen=d=>d&&(d.kind==='form'||d.vista==='generado');

/* ---------- diagrama generado desde el formulario ---------- */
let genCache={key:'',L:null};
function wrapTxt(s,n){const w=String(s||'').split(/\s+/),L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>n&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim()});return L.slice(0,4)}
function layoutFlow(d){
  const acts=orderActs(d),key=JSON.stringify([d.nombre,acts,kids(d.id).map(k=>k.parentActId)]);
  if(genCache.key===key)return genCache.L;
  const lanes=[...new Set(acts.map(a=>String(a.responsable||'').trim()||'Sin responsable'))];
  const lw=170,cw=200,LH=140,top=56,bw=160,bh=72,W=Math.max(900,lw+30+Math.max(1,acts.length)*cw),H=top+Math.max(1,lanes.length)*LH+16;
  const pos={},P={};
  acts.forEach((a,i)=>{const lane=lanes.indexOf(String(a.responsable||'').trim()||'Sin responsable');const x=lw+20+i*cw+(cw-bw)/2,y=top+lane*LH+(LH-bh)/2;P[a.id]={x,y,lane,i};pos[a.id]={x:x/W,y:y/H,w:bw/W,h:bh/H}});
  let g=`<rect width="${W}" height="${H}" fill="#fff"/><text x="20" y="36" font-size="22" font-weight="700" fill="#141210">${esc(d.nombre)}</text>`;
  if(!acts.length)g+=`<text x="20" y="${top+40}" font-size="16" fill="#6b665f">Agrega actividades con el botón “Actividades (formulario)”.</text>`;
  lanes.forEach((l,i)=>{const y=top+i*LH;g+=`<rect x="10" y="${y}" width="${W-20}" height="${LH}" fill="${i%2?'#f6f4f1':'#fff'}" stroke="#9c968d"/><rect x="10" y="${y}" width="${lw}" height="${LH}" fill="#e7e4df" stroke="#9c968d"/>`;
    wrapTxt(l,18).forEach((t,j,a)=>{g+=`<text x="${10+lw/2}" y="${y+LH/2+(j-(a.length-1)/2)*18+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#141210">${esc(t)}</text>`})});
  const byOrden={};acts.forEach(a=>{byOrden[a.id]=a});
  acts.forEach((a,i)=>{
    const p=P[a.id],dec=a.forma==='Decisión';
    let tg;
    if(dec&&Array.isArray(a.ramas)&&a.ramas.length)tg=a.ramas.filter(r=>P[r.dest]&&r.dest!==a.id).map(r=>({id:r.dest,lbl:r.etiqueta}));
    else{tg=(Array.isArray(a.sig)?a.sig:[]).filter(id=>P[id]&&id!==a.id).map(id=>({id,lbl:''}));if(!tg.length&&a.forma!=='Fin'&&acts[i+1])tg=[{id:acts[i+1].id,lbl:''}]}
    tg.forEach((t,k)=>{const q=P[t.id],cx=p.x+bw/2;let path,lx,ly;
      if(k===0){const x1=p.x+bw+(dec?4:0),y1=p.y+bh/2;
        if(q.i>p.i){const m=p.x+bw+(cw-bw)/2,y2=q.y+bh/2;path=`M${x1} ${y1} H${m} V${y2} H${q.x-2}`}
        else{const lb=top+(Math.max(p.lane,q.lane)+1)*LH-10;path=`M${x1} ${y1} H${p.x+bw+(cw-bw)/2-6} V${lb} H${q.x+bw/2} V${q.y+bh+2}`}
        lx=x1+4;ly=y1-6}
      else{const y1=p.y+bh+(dec?6:0),yb=Math.min(top+(p.lane+1)*LH-6,y1+14+(k-1)*8);
        if(q.i>p.i){const m=q.x-(cw-bw)/2+6+(k-1)*5;path=`M${cx} ${y1} V${yb} H${m} V${q.y+bh/2} H${q.x-2}`}
        else{path=`M${cx} ${y1} V${yb} H${q.x+bw/2+(k-1)*8} V${q.y+bh+2}`}
        lx=cx+5;ly=y1+13}
      g+=`<path d="${path}" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>`;
      if(t.lbl)g+=`<text x="${lx}" y="${ly}" font-size="12" font-weight="700" fill="#c8371e">${esc(t.lbl)}</text>`})});
  acts.forEach((a,i)=>{const p=P[a.id],cx=p.x+bw/2,cy=p.y+bh/2,f=a.forma||'Actividad',sub=kids(d.id,a.id).length;
    if(f==='Decisión')g+=`<path d="M${cx} ${p.y-6} L${p.x+bw+4} ${cy} L${cx} ${p.y+bh+6} L${p.x-4} ${cy}Z" fill="#fff" stroke="#141210" stroke-width="1.6"/>`;
    else if(f==='Inicio'||f==='Fin')g+=`<rect x="${p.x}" y="${p.y+8}" width="${bw}" height="${bh-16}" rx="${(bh-16)/2}" fill="${f==='Inicio'?'#e9f2ec':'#f6e4df'}" stroke="#141210" stroke-width="1.6"/>`;
    else if(f==='Documento')g+=`<path d="M${p.x} ${p.y} H${p.x+bw} V${p.y+bh-8} Q${p.x+bw*.75} ${p.y+bh-20} ${cx} ${p.y+bh-6} T${p.x} ${p.y+bh-6}Z" fill="#fff" stroke="#141210" stroke-width="1.6"/>`;
    else g+=`<rect x="${p.x}" y="${p.y}" width="${bw}" height="${bh}" rx="7" fill="#fff" stroke="#141210" stroke-width="${sub?2.6:1.6}"/>${sub?`<line x1="${p.x+9}" y1="${p.y}" x2="${p.x+9}" y2="${p.y+bh}" stroke="#141210"/><line x1="${p.x+bw-9}" y1="${p.y}" x2="${p.x+bw-9}" y2="${p.y+bh}" stroke="#141210"/>`:''}`;
    g+=`<text x="${p.x+6}" y="${p.y-6}" font-size="11" fill="#6b665f">${i+1}</text>`;
    wrapTxt(a.nombre,f==='Decisión'?14:19).forEach((t,j,L)=>{g+=`<text x="${cx}" y="${cy+(j-(L.length-1)/2)*16+5}" text-anchor="middle" font-size="13.5" fill="#141210">${esc(t)}</text>`})});
  const svg=`<svg xmlns="http:\/\/www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>${g}</svg>`;
  const L={svg,ar:H/W,pos,url:URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}))};
  if(genCache.L)URL.revokeObjectURL(genCache.L.url);genCache={key,L};return L}
const zoneOf=(d,a)=>isGen(d)?layoutFlow(d).pos[a.id]:(a.x!=null?a:null);

/* ---------- PDF ---------- */
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function getPdf(aid){if(!pdfCache[aid]){pdfCache[aid]=(async()=>{const b=await blobOf(aid);return pdfjsLib.getDocument({data:new Uint8Array(await b.arrayBuffer()),isEvalSupported:false}).promise})();pdfCache[aid].catch(()=>{delete pdfCache[aid]})}return pdfCache[aid]}
async function extract(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent(),bx=[];
    for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;const t=pdfjsLib.Util.transform(vp.transform,it.transform);const h=Math.hypot(t[2],t[3]);if(!h)continue;let w=it.width*vp.scale;if(!w)w=s.length*h*.5;bx.push({x:t[4],y:t[5]-h,w,h,s})}
    bx.sort((a,b)=>a.y-b.y||a.x-b.x);
    const bl=[];
    for(const b of bx){let m=null,same=false;
      for(const k of bl){const r=b.h/k.fh;if(r<.7||r>1.45)continue;const tol=b.h*1.1;if(!(b.x<k.x2+tol&&b.x+b.w>k.x-tol))continue;
        const sl=Math.abs(b.y-k.ly)<b.h*.5&&b.x<k.lx2+b.h*1.2,nl=b.y>k.ly+b.h*.3&&b.y-k.y2<b.h*.8;if(sl||nl){m=k;same=sl;break}}
      if(m){if(same)m.t+=b.x>m.lx2+b.h*.12?' ':'';else if(m.t.endsWith('-'))m.t=m.t.slice(0,-1);else m.t+=' ';m.t+=b.s;
        m.x=Math.min(m.x,b.x);m.y=Math.min(m.y,b.y);m.x2=Math.max(m.x2,b.x+b.w);m.y2=Math.max(m.y2,b.y+b.h);m.ly=b.y;m.lx2=b.x+b.w}
      else bl.push({x:b.x,y:b.y,x2:b.x+b.w,y2:b.y+b.h,fh:b.h,t:b.s,ly:b.y,lx2:b.x+b.w})}
    for(const k of bl){const t=k.t.replace(/\s+/g,' ').trim();if(t.length<3||!/[a-záéíóúñü]/i.test(t))continue;const pd=k.fh*.45;

async function detect(d){
  let pdf;try{pdf=await getPdf(d.assetId)}catch(e){toast('No se pudo leer el PDF.');return}
  toast('Leyendo actividades del PDF…');
  const c=await extract(pdf),cur=()=>D(d.id)||d;
  const seen=new Set((cur().actividades||[]).map(a=>a.pag+'|'+norm(a.nombre)));
  const list=c.filter(x=>!seen.has(x.pag+'|'+norm(x.nombre)));
  const markDone=()=>{if(!cur().revisado)put('diagramas',{...cur(),revisado:true})};
  if(!c.length){markDone();toast('El PDF no trae texto legible (¿escaneado?). Marca las zonas a mano o usa el formulario.');return}
  if(!list.length){markDone();toast('No se encontraron actividades nuevas.');return}
  openDlg(`<h3>Actividades detectadas</h3><p class="mut">Desmarca títulos de carriles, encabezados y notas. Luego completa responsable y descripción en “Actividades (formulario)”.</p>
  <div class="row" style="margin:0 0 6px"><button type="button" class="lnk" data-a="chk" data-v="1">Marcar todas</button><button type="button" class="lnk" data-a="chk" data-v="">Ninguna</button></div>
  <div class="rev">${list.map((x,i)=>`<div class="ri"><input type="checkbox" name="c${i}" checked aria-label="Incluir"><input name="n${i}" value="${esc(x.nombre)}" aria-label="Nombre">${pdf.numPages>1?`<small>p.${x.pag}</small>`:''}</div>`).join('')}</div>
  <div class="row end"><button type="button" class="btn" data-a="dlg-close">Omitir</button><button class="btn pri">Guardar actividades</button></div>`,
  fd=>{const base=(cur().actividades||[]).length;const add=list.map((x,i)=>fd.get('c'+i)?{...x,id:uid(),nombre:String(fd.get('n'+i)||x.nombre).trim()||x.nombre,responsable:'',descripcion:'',forma:'Actividad'}:null).filter(Boolean).map((a,i)=>({...a,orden:base+i+1}));
    put('diagramas',{...cur(),actividades:[...(cur().actividades||[]),...add],revisado:true});toast(add.length+' actividades guardadas. Completa responsable y descripción en el formulario.')},markDone)}

let lastKey='',tok=0,task=null,lastClk={};
async function drawStage(){
  const d=D(S.cur),cv=$('#cv'),im=$('#im'),st=$('#stage'),em=$('#empty');
  if(!d){st.hidden=true;em.hidden=false;em.innerHTML=guide();lastKey='';return}
  const W=Math.max(280,$('#viewport').clientWidth-34),gen=isGen(d),L=gen?layoutFlow(d):null;
  const key=[d.id,gen?L.url:d.assetId,S.page,S.zoom,W].join('|');
  if(key===lastKey){overlay();return}
  lastKey=key;const my=++tok;st.hidden=false;em.hidden=true;
  try{
    if(!gen&&d.kind==='pdf'){
      if(!window.pdfjsLib)throw new Error('lib');
      im.hidden=true;cv.hidden=false;
      const pdf=await getPdf(d.assetId);if(my!==tok)return;
      S.pages=pdf.numPages;if(S.page>S.pages)S.page=1;
      const pg=await pdf.getPage(S.page);if(my!==tok)return;
      const v1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:W/v1.width*S.zoom}),dpr=Math.min(window.devicePixelRatio||1,2);
      if(task){try{task.cancel()}catch(e){}}
      cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
      cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';st.style.width=vp.width+'px';st.style.height=vp.height+'px';
      task=pg.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:undefined});
      await task.promise.catch(e=>{if(!e||e.name!=='RenderingCancelledException')throw e});
    }else{
      cv.hidden=true;im.hidden=false;S.pages=1;S.page=1;let src,ar;
      if(gen){src=L.url;ar=L.ar}else{const b=await blobOf(d.assetId);if(my!==tok)return;src=urls[d.assetId]||(urls[d.assetId]=URL.createObjectURL(b))}
      if(im.getAttribute('src')!==src)im.src=src;
      if(!(im.complete&&im.naturalWidth))await new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,5000)});
      if(my!==tok)return;
      const w=W*S.zoom,h=ar?w*ar:im.naturalWidth?w*im.naturalHeight/im.naturalWidth:w*.6;
      im.style.width=w+'px';im.style.height=h+'px';st.style.width=w+'px';st.style.height=h+'px';
    }
  }catch(e){if(my===tok){st.hidden=true;em.hidden=false;em.innerHTML=`<p class="mut">No se pudo abrir el archivo de este diagrama${window.pdfjsLib?'':' (el lector de PDF no cargó; revisa la conexión)'}.${d.actividades&&d.actividades.length?' Puedes cambiar a la vista “Generado”.':''}</p>`;lastKey=''}return}
  overlay();toolbar();
  if(!gen&&d.kind==='pdf'&&!d.revisado&&canWrite&&!S.reviewing){S.reviewing=true;detect(d).finally(()=>{S.reviewing=false})}
}

/* ---------- portafolio ---------- */
function portRows(){
  let rows=Object.values(S.items).filter(i=>IT[i.tipo]);
  if(S.scope){const ids=S.scope.a?scopeIds(S.scope.d,S.scope.a):new Set(subtree(S.scope.d));rows=rows.filter(i=>ids.has(i.diagramaId)||(i.diagramaId===S.scope.d&&(!S.scope.a||i.actividadId===S.scope.a)))}
  const t=$('#fTipo').value,e=$('#fEst').value,q=norm($('#fQ').value);
  if(t)rows=rows.filter(i=>i.tipo===t);if(e)rows=rows.filter(isOpen);
  if(q)rows=rows.filter(i=>norm(i.titulo+' '+(i.responsable||'')+' '+pathOf(i)).includes(q));
  return rows.sort((a,b)=>TT.indexOf(a.tipo)-TT.indexOf(b.tipo)||pathOf(a).localeCompare(pathOf(b),'es'))}
const valOf=i=>i.tipo==='indicador'?`${i.actual||'—'} / ${i.meta||'—'} ${i.unidad||''}`.trim():i.tipo==='iniciativa'?`${i.estado||''} · ${num(i.avance)}%`:`${i.estado||''} · ${i.prioridad||''}`;
function portfolio(){
  const all=Object.values(S.items);
  const k=[[all.filter(i=>i.tipo==='oportunidad'&&isOpen(i)).length,'Oportunidades abiertas'],[all.filter(i=>i.tipo==='iniciativa'&&i.estado==='En curso').length,'Iniciativas en curso'],[all.filter(i=>i.tipo==='indicador'&&offTarget(i)).length,'Indicadores fuera de meta'],[Object.keys(S.diag).length,'Diagramas mapeados']];
  $('#kpis').innerHTML=k.map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#fScope').innerHTML=S.scope?`<span class="scope">Ámbito: ${esc(S.scope.label)} <button class="lnk" data-a="clear-scope" aria-label="Quitar ámbito">×</button></span>`:'';
  const rows=portRows();
  $('#prows').innerHTML=rows.length?rows.map(i=>`<tr><td>${esc(IT[i.tipo]?IT[i.tipo].one:i.tipo)}</td><td><strong>${esc(i.titulo)}</strong></td><td><button class="lnk" data-a="goto" data-d="${esc(i.diagramaId)}" data-ac="${esc(i.actividadId||'')}">${esc(pathOf(i))}</button></td><td>${i.tipo==='indicador'?`<span class="dot ${offTarget(i)?'bad':'ok'}"></span> `:''}${esc(valOf(i))}</td><td>${esc(i.responsable||'')}</td></tr>`).join(''):`<tr><td colspan="5" class="mut">Sin registros con estos filtros.</td></tr>`}

function openDiag(id,act){if(S.view==='wiz'&&id!==S.cur){S.view='mapa'}S.cur=id;S.act=act||null;S.form=null;S.view='mapa';const a=actOf(D(id),S.act);S.page=a&&!isGen(D(id))?(a.pag||1):1;render(true)}
function selAct(id){const d=D(S.cur),a=actOf(d,id);S.act=a?a.id:null;S.form=null;if(a&&!isGen(d)&&(a.pag||1)!==S.page)S.page=a.pag||1;
  if(a&&S.auto){const ch=kids(d.id,a.id);if(ch.length===1){openDiag(ch[0].id);return}}render(true)}
function armed(b){if(b.dataset.armed)return true;b.dataset.armed=1;const t=b.textContent;b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},3000);return false}
document.addEventListener('click',async e=>{

  if(wzClick(b)||isoClick(b))return;
  if(a==='sel-act'){const now=Date.now();if(id&&lastClk.id===id&&now-lastClk.t<450&&!S.edit){lastClk={};const ch=kids(S.cur,id);if(ch.length){openDiag(ch[0].id);return}}lastClk={id,t:now};selAct(id)}
  else if(a==='open-diag')openDiag(id,b.dataset.act||null);
  else if(a==='new-root')diagDlg(null,null);
  else if(a==='new-child')diagDlg(null,{d:S.cur,a:S.act});

  else if(a==='tab'){S.tab=b.dataset.t;S.form=null;render(true)}

  else if(a==='edit-act'){const x=actOf(D(S.cur),S.act);if(x)actDlg(x)}
  else if(a==='del-act'){const d=D(S.cur);if(!armed(b))return;const aid=S.act;closeDlg(false);S.act=null;
    itemsAt(d.id,aid).forEach(it=>put('items',{...it,actividadId:null}));put('diagramas',{...D(d.id),actividades:(D(d.id).actividades||[]).filter(x=>x.id!==aid).map(x=>({...x,sig:(x.sig||[]).filter(s=>s!==aid)}))})}
  else if(a==='row-add'){const tb=$('#aedBody'),n=tb.rows.length;tb.insertAdjacentHTML('beforeend',actRow({},n,[]));tb.rows[n].querySelector('[name=nombre]').focus()}
  else if(a==='row-del'){b.closest('tr').remove()}
  else if(a==='rama-add'){b.insertAdjacentHTML('beforebegin',ramaRow({etiqueta:'',n:''},[]));b.previousElementSibling.querySelector('[name=rl]').focus()}
  else if(a==='rama-del'){b.closest('.rama').remove()}
  else if(a==='dic-start'){if(listening){stopDictado();flushDictado(false)}else startDictado()}
  else if(a==='dic-apply'){flushDictado(true)}
  else if(a==='scope'){const d=D(S.cur),ac=actOf(d,S.act);S.scope={d:d.id,a:S.act,label:ac?ac.nombre:d.nombre};S.view='port';$('#fTipo').value=S.tab;render()}
  else if(a==='clear-scope'){S.scope=null;render()}

  else if(a==='dlg-close')closeDlg(true);
  else if(a==='chk')$('#dlgForm').querySelectorAll('.rev input[type=checkbox]').forEach(c=>c.checked=!!b.dataset.v);
});

const ov=$('#ov'),tip=$('#tip');
function showTip(e,b){const d=D(S.cur),a=actOf(d,b.dataset.id);if(!a){tip.hidden=true;return}
  const ch=kids(d.id,a.id).length;tip.innerHTML=`<b>${esc(a.nombre)}</b>${a.responsable?`<i>${esc(a.responsable)}</i>`:''}${a.descripcion?esc(a.descripcion.length>320?a.descripcion.slice(0,320)+'…':a.descripcion):'<i>Sin descripción</i>'}${a.forma==='Decisión'&&(a.ramas||[]).length?'<i style="margin-top:4px">'+a.ramas.map(r=>{const t=actOf(d,r.dest);return esc(r.etiqueta)+' → '+(t?esc(t.nombre):'sin destino')}).join(' · ')+'</i>':''}${ch?'<i style="margin-top:4px">Doble clic: abrir flujo de detalle</i>':''}`;tip.hidden=false;moveTip(e)}
function moveTip(e){const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+16;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-12;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
ov.addEventListener('mouseover',e=>{const b=e.target.closest('.hs');if(b&&!drag)showTip(e,b)});
ov.addEventListener('mousemove',e=>{if(!tip.hidden)moveTip(e)});
ov.addEventListener('mouseout',e=>{const b=e.target.closest('.hs');if(b&&!b.contains(e.relatedTarget))tip.hidden=true});

    if(b.dataset.x==='copy'){const inp=b.previousElementSibling;try{await navigator.clipboard.writeText(inp.value);toast('Enlace copiado.')}catch(err){inp.select();toast('Pulsa Ctrl+C para copiar.')}}
    if(b.dataset.x==='key'){if(!armed(b))return;try{adminList=await run('api_newKey',BOOT.admin,b.dataset.id);adminRender();toast('Clave nueva generada. Envía el nuevo enlace Gestionar.')}catch(err){toast(err.message)}}
    if(b.dataset.x==='ren'){const c=adminList.find(x=>x.id===b.dataset.id);openDlg(`<h3>Renombrar cliente</h3><label>Nombre<input name="n" required value="${esc(c.nombre)}"></label><div class="row end"><button type="button" class="btn" data-a="dlg-close">Cancelar</button><button class="btn pri">Guardar</button></div>`,async fd=>{try{adminList=await run('api_renameClient',BOOT.admin,c.id,String(fd.get('n')));adminRender()}catch(err){toast(err.message);return false}})}})}

/* ---------- arranque ---------- */
(async()=>{
  const q=new URLSearchParams(location.search);
  $('#mapa').hidden=true;$('#banner').textContent='Cargando…';
  try{BOOT=await run('api_boot',{admin:q.get('admin')||'',cliente:q.get('cliente')||'',clave:q.get('clave')||''})}
  catch(e){document.body.innerHTML=`<div class="msgbox"><h2 style="margin-top:0">Mapa de procesos</h2><p>${esc(e.message)}</p></div>`;return}
  $('#banner').textContent='';
  if(BOOT.mode==='admin'){$('#modeTag').textContent='Administrador';$('#modeTag').classList.add('g');adminInit();return}
  C=BOOT.cliente.id;K=BOOT.k||'';canWrite=BOOT.mode==='gestionar';document.title='Mapa de procesos · '+BOOT.cliente.nombre;

  $('#cliName').textContent=BOOT.cliente.nombre;$('#modeTag').textContent=canWrite?'Gestionar':'Ver';$('#modeTag').classList.toggle('g',canWrite);
  $('#btnNew').hidden=!canWrite;$('#banner').textContent='Cargando…';render(true);load();
  setInterval(()=>{if(!pending&&!S.form&&S.view!=='wiz'&&!$('#dlg').open&&document.visibilityState==='visible')load()},120000);
})();
}
</script>
</body>
